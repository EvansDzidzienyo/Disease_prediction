name: Disease model reproducibility

on:
  push:
    paths:
      - "classification_data.csv"
      - "train.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/disease-reproducibility.yml"
  pull_request:
    paths:
      - "classification_data.csv"
      - "train.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/disease-reproducibility.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Train and evaluate
        run: python train.py
      - name: Test model inference and serialization
        run: pytest -q
